name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 0.1.0
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Pick release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#[vV]}"; v="${v#.}"
          if [ -n "$v" ]; then
            [[ "$v" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::Version must look like 0.1.0"; exit 1; }
            echo "TAG=v$v" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Test and build debug APK
        if: env.TAG == ''
        run: ./gradlew testDebugUnitTest assembleDebug -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: konkr-remap-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release and publish
        if: env.TAG != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Add the KEYSTORE_* secrets (see README)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          ./gradlew testReleaseUnitTest assembleRelease -PversionName="${TAG#v}" -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "konkr-remap-$TAG.apk"
          gh release create "$TAG" "konkr-remap-$TAG.apk" --target "$GITHUB_SHA" --generate-notes
