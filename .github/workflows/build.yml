name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew testDebugUnitTest assembleDebug -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: konkr-remap-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Add the KEYSTORE_* secrets (see README)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          ./gradlew testReleaseUnitTest assembleRelease -PversionName="${GITHUB_REF_NAME#v}" -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "konkr-remap-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "konkr-remap-$GITHUB_REF_NAME.apk" --generate-notes
